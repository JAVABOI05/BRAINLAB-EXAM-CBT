name: Regenerate security lockfile and apply safe lint fixes

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/regenerate-security-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'fix/security-deps-and-lint-baseline' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply ESLint's safe automatic fixes
        shell: bash
        run: |
          set +e
          npx eslint . --fix
          lint_status=$?
          echo "ESLint --fix exit status: $lint_status (remaining issues are reported by the required CI workflow)"
          exit 0
      - name: Commit lockfile and safe lint fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: apply safe ESLint auto-fixes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
