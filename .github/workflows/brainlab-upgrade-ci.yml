name: BrainLab upgrade CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/brainlab-academy-upgrade
      - feature/learning-hub-foundation
      - fix/learning-hub-assessment-atomicity
      - feature/learner-dashboard-profile-on-learning-hub
      - arena/full-implementation
  pull_request:
    branches:
      - main
      - feature/brainlab-academy-upgrade
      - feature/learning-hub-foundation

concurrency:
  group: brainlab-upgrade-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-pr118-lockfile:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/tutor-avatar-upload-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/tutor-avatar-upload-diagnostics
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile if package.json changed
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when it changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          changed="$(git status --short | awk '{print $2}')"
          if [[ -z "$changed" ]]; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          if [[ "$changed" != "package-lock.json" ]]; then
            echo "Unexpected changed paths; refusing to commit:"
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: sync PR 118 ESLint lockfile"
          git push origin HEAD:fix/tutor-avatar-upload-diagnostics
      - name: Verify clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify tutor profile lint
        run: npx eslint app/tutor/profile/page.tsx
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com

  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/tutor-avatar-upload-diagnostics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check tracked environment files and public secret variable names
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$tracked_env_files" ]]; then
            echo "Unexpected tracked environment file(s):"
            printf '%s\n' "$tracked_env_files"
            exit 1
          fi
          if git grep -n -I -E 'NEXT_PUBLIC_[A-Z0-9_]*(SERVICE_ROLE|SECRET|PRIVATE_KEY)' -- app; then
            echo "A private credential appears to use a NEXT_PUBLIC_ variable name."
            exit 1
          fi
          echo "Environment-file and public-secret-name checks passed."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check patch whitespace
        run: git diff --check

      - name: ESLint changed JavaScript and TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            diff_base="origin/${GITHUB_BASE_REF}"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            diff_base="${GITHUB_EVENT_BEFORE}"
          else
            diff_base="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${diff_base}...HEAD" -- '*.js' '*.jsx' '*.ts' '*.tsx' | grep -vE '(^|/)(node_modules|\.next)/' || true)
          if (("${#files[@]}" > 0)); then
            npx eslint "${files[@]}"
          else
            echo "No changed JavaScript/TypeScript files to lint."
          fi

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
          NEXT_PUBLIC_SITE_URL: https://example.com

