name: BrainLab CI

on:
  pull_request:
  push:
    branches:
      - phase0-hardening
      - fix/learning-hub-assessment-atomicity
      - arena/full-implementation
      - feat/candidate-session-recovery
      - fix/assessment-auth-repair-on-current-production

permissions:
  contents: read

concurrency:
  group: brainlab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-only placeholders. Never use these values for a deployed environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check whitespace and patch integrity
        run: git diff --check
      - name: ESLint changed JavaScript and TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            diff_base="origin/${GITHUB_BASE_REF}"
          else
            diff_base="${GITHUB_EVENT_BEFORE:-HEAD^}"
            if [[ "${diff_base}" == "0000000000000000000000000000000000000000" ]]; then
              diff_base="HEAD^"
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${diff_base}...HEAD" -- '*.js' '*.jsx' '*.ts' '*.tsx' | grep -vE '(^|/)(node_modules|\.next)/' || true)
          if (("${#files[@]}" > 0)); then
            npx eslint "${files[@]}"
          else
            echo "No changed JavaScript/TypeScript files to lint."
          fi
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Candidate session recovery regression tests
        run: npm run test:session-recovery
      - name: CBT access-code transaction PGlite regression tests
        run: npm run test:cbt-transaction:pglite
      - name: Offline exam sync and local recovery regression tests
        run: npm run test:offline-sync
      - name: Cloze passage rotation regression tests
        run: npx tsx scripts/test-cloze-selection.ts
      - name: Production build
        run: npm run build
