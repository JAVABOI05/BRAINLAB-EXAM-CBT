name: BrainLab CI

on:
  pull_request:
  push:
    branches:
      - phase0-hardening
      - fix/learning-hub-assessment-atomicity

permissions:
  contents: read

concurrency:
  group: brainlab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build-only placeholders. Never use these values for a deployed environment.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check whitespace and patch integrity
        run: git diff --check
      - name: ESLint changed files (incremental baseline)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF}...HEAD" -- '*.js' '*.jsx' '*.ts' '*.tsx' | grep -vE '(^|/)(node_modules|\.next)/' || true)
            if (("${#files[@]}" > 0)); then
              npx eslint "${files[@]}"
            else
              echo "No changed JavaScript/TypeScript files to lint."
            fi
          else
            npm run lint
          fi
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
