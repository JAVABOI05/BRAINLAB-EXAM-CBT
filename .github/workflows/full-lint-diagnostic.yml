name: Temporary full-project lint diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/full-lint-diagnostic.yml"

permissions:
  contents: read

jobs:
  full-lint:
    if: github.event.pull_request.head.ref == 'fix/security-deps-and-lint-baseline' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full project ESLint
        run: npm run lint
